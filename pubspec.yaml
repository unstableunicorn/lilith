name: lilith
description: "Private cycle tracking from skin temperature, stored on your own Solid pod."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  solidpod: ^2.0.0
  shared_preferences: ^2.5.6
  provider: ^6.1.5+1
  url_launcher: ^6.3.3
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
