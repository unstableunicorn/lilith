name: lilith
description: "Private cycle tracking from skin temperature, stored on your own Solid pod."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.6
  encrypter_plus: ^5.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  http: ^1.2.0
  material_ui: ^1.11.1
  meta: ^1.16.0
  oidc: ^4.0.0
  pdf: ^3.13.1
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  solid_auth: ^1.1.1
  solidpod: ^2.0.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
