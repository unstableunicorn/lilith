# On every push to main: deploy the web app to lilith.unstableunicorn.dev, and
# build the Android APK and publish it as the rolling "latest" release.
# The web build is scripts/ci.sh --only web; wrangler (pinned in mise.toml)
# uploads it. The APK is signed with the project's test key from the secrets.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MISE_YES: "1"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://lilith.unstableunicorn.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          scripts/install-mise.sh /usr/local/bin
          mise trust
          mise install flutter node npm:wrangler
      - name: Build
        env:
          LILITH_BUILD: ${{ github.run_number }}
          LILITH_COMMIT: ${{ github.sha }}
        run: PATH="$HOME/.local/share/mise/shims:$PATH" bash scripts/ci.sh --only web
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: PATH="$HOME/.local/share/mise/shims:$PATH" wrangler deploy

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/install-mise.sh /usr/local/bin
          mise trust
          mise install flutter
      - name: Build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          keystore="$RUNNER_TEMP/lilith-test.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          export ANDROID_KEYSTORE_PATH="$keystore"
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64 --build-number="$BUILD_NUMBER" \
            --dart-define=LILITH_BUILD="$BUILD_NUMBER" --dart-define=LILITH_COMMIT="$SHA"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk lilith-android-arm64.apk
          rm -f "$keystore"
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --title "Latest build" \
              --notes "The Android app, rebuilt from every push to main. Test-signed; not from an app store."
          fi
          gh release edit latest --prerelease --title "Latest build (#$RUN_NUMBER)" \
            --notes "The Android app (arm64), built from $SHA. Test-signed; not from an app store. Each build installs over the last."
          gh release upload latest lilith-android-arm64.apk --clobber
