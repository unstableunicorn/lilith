# Build the web app on main and publish it to GitHub Pages at /lilith/.
# The Solid OIDC client profile and redirect page ship in web/, so they land beside it.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MISE_YES: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/install-mise.sh /usr/local/bin
          mise trust && mise install flutter
      - run: PATH="$HOME/.local/share/mise/shims:$PATH" bash scripts/ci.sh --only web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
